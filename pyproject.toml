[project]
name = "underwriting"
version = "0.1.0"
description = "Multi-agent underwriting pipeline"
readme = "README.md"
authors = [
    { name = "Atharva Chundurwar Coforge", email = "atharva.c@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "ollama",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["live: needs a running local Ollama; skipped unless RUN_LIVE_OLLAMA=1"]
